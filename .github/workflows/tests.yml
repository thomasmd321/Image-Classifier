name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies (CPU-only PyTorch)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Run tests
        run: pytest -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the demo image
        run: docker build -t flower-classifier .
      - name: Start the demo with an untrained checkpoint
        run: |
          docker run -d --name demo -p 7860:7860 flower-classifier sh -c "
            python -c \"import model_utils as m; net = m.build_model('densenet121', [64], 102, pretrained=False); m.save_checkpoint(net, [64], 102, 0.5, {str(i): i - 1 for i in range(1, 103)}, save_dir='/tmp')\" &&
            CHECKPOINT=/tmp/check_point.pt python app.py"
      - name: Check the demo responds
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:7860/ > /dev/null; then echo "Demo is up"; exit 0; fi
            sleep 2
          done
          docker logs demo
          exit 1
